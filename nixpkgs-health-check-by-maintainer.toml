# Configuration for nixpkgs-health-check-action

# Checks only the updater because I wrote the most of logics
[packages.fishnet.hydra]
skip = "Not interested in Hydra for now"

[packages.lichess-bot.hydra]
skip = "Not interested in Hydra for now"

[packages.stockfish.hydra]
skip = "Not interested in Hydra for now"

[packages.systemd-lsp.hydra]
skip = "Not interested in Hydra for now"

# For testing
[packages.hello]
hydra = { skip = "Test skip" }
nixpkgs-update = { skip = "Test skip" }

[[packages.fresh-editor.nixpkgs-update.ignore]]
url = "https://nixpkgs-update-logs.nixos.org/fresh-editor/2026-11-06.log"
reason = "Wait for merging https://github.com/NixOS/nixpkgs/pull/585026"

[[global.nixpkgs-update.ignore]]
pattern = 'go: go\.mod requires go >= [0-9.]+'
reason = "Allow Go version delay across packages"
