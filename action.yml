name: 'Nixpkgs Health Check'
description: 'Checks the health of a Nixpkgs package using hydra-check and nixpkgs-update logs'
author: 'kachick'
inputs:
  pname:
    description: 'Package name in Nixpkgs'
    required: true
  service:
    description: 'Service to check (hydra or nixpkgs-update). If omitted, both will be checked.'
    required: false
  config:
    description: 'Path to the configuration file for skipping checks'
    default: 'nixpkgs-health-check.toml'
    required: false
outputs:
  skipped:
    description: 'Whether the requested service check was skipped'
    value: ${{ steps.check-skip.outputs.skipped }}
runs:
  using: 'composite'
  steps:
    - name: Check skip status
      id: check-skip
      shell: bash
      env:
        PNAME: ${{ inputs.pname }}
        CONFIG: ${{ inputs.config }}
        SERVICE: ${{ inputs.service }}
      run: |
        # Ensure the config path is absolute for Nix builtins.readFile
        if [[ "$CONFIG" != /* ]]; then
          config_file="$PWD/$CONFIG"
        else
          config_file="$CONFIG"
        fi

        # Check Hydra skip status
        json_hydra=$("${{ github.action_path }}/check-skip.bash" --pname "$PNAME" --service "hydra" --config "$config_file")
        hydra_skip=$(echo "$json_hydra" | jq -r .skip)
        hydra_reason=$(echo "$json_hydra" | jq -r .reason)

        # Check nixpkgs-update skip status
        json_update=$("${{ github.action_path }}/check-skip.bash" --pname "$PNAME" --service "nixpkgs-update" --config "$config_file")
        update_skip=$(echo "$json_update" | jq -r .skip)
        update_reason=$(echo "$json_update" | jq -r .reason)

        # Context-aware generic skipped output
        if [[ "$SERVICE" == "hydra" ]]; then
          echo "skipped=$hydra_skip" >> "$GITHUB_OUTPUT"
        elif [[ "$SERVICE" == "nixpkgs-update" ]]; then
          echo "skipped=$update_skip" >> "$GITHUB_OUTPUT"
        else
          echo "skipped=false" >> "$GITHUB_OUTPUT"
        fi

        # Forward flags for internal steps
        echo "hydra_skip=$hydra_skip" >> "$GITHUB_OUTPUT"
        echo "update_skip=$update_skip" >> "$GITHUB_OUTPUT"

        if [[ "$hydra_skip" == "true" ]]; then
           echo "Skipping Hydra check for $PNAME: $hydra_reason"
        fi
        if [[ "$update_skip" == "true" ]]; then
           echo "Skipping nixpkgs-update check for $PNAME: $update_reason"
        fi

    - name: Run hydra-check
      if: (inputs.service == '' || inputs.service == 'hydra') && steps.check-skip.outputs.hydra_skip != 'true'
      shell: bash
      env:
        PNAME: ${{ inputs.pname }}
      run: |
        nix run 'github:NixOS/nixpkgs/nixpkgs-unstable#hydra-check' -- --json --channel=nixpkgs-unstable --eval "$PNAME" | tee raw_hydra.json

    - name: Normalize Hydra result
      if: (inputs.service == '' || inputs.service == 'hydra') && steps.check-skip.outputs.hydra_skip != 'true'
      shell: bash
      run: |
        jq --from-file "${{ github.action_path }}/normalize-hydra-eval.jq" raw_hydra.json | tee normalized_hydra.json

    - name: Report Hydra errors
      if: (inputs.service == '' || inputs.service == 'hydra') && steps.check-skip.outputs.hydra_skip != 'true'
      shell: bash
      env:
        PNAME: ${{ inputs.pname }}
      run: |
        if jq -e '.[] | select(.severity == "error")' normalized_hydra.json > hydra_errors.jsonl; then
          echo "::error::Hydra check failed for $PNAME"
          cat hydra_errors.jsonl
          exit 1
        fi

    - name: Run nixpkgs-update-log-checker
      if: (inputs.service == '' || inputs.service == 'nixpkgs-update') && steps.check-skip.outputs.update_skip != 'true'
      shell: bash
      env:
        PNAME: ${{ inputs.pname }}
      run: |
        nix run 'github:kachick/nixpkgs-update-log-checker' -- --packages "$PNAME"
