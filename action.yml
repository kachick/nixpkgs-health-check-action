name: 'Nixpkgs Health Check'
description: 'Checks the health of a Nixpkgs package using hydra-check and nixpkgs-update logs'
inputs:
  pname:
    description: 'Package name in Nixpkgs'
    required: true
  hydra:
    description: 'Whether to run Hydra check'
    default: 'true'
    required: false
  nixpkgs-update:
    description: 'Whether to run nixpkgs-update check'
    default: 'true'
    required: false
  config:
    description: 'Path to the skip-list configuration file'
    default: 'nixpkgs-health-check-by-maintainer.toml'
    required: false
runs:
  using: 'composite'
  steps:
    # Service 1: Hydra
    - name: Hydra skip status
      if: inputs.hydra == 'true'
      id: hydra-skip
      shell: bash
      env:
        PNAME: ${{ inputs.pname }}
        CONFIG: ${{ inputs.config }}
      run: |
        if [[ -f "$CONFIG" ]]; then
          json=$("${{ github.action_path }}/check-skip.bash" --pname "$PNAME" --service "hydra" --config "$CONFIG")
          if [[ $(echo "$json" | jq -r .skip) == "true" ]]; then
             echo "Skipping $PNAME for hydra. Reason: $(echo "$json" | jq -r .reason)"
             echo "should_skip=true" >> "$GITHUB_OUTPUT"
          fi
        fi

    - name: Run hydra-check
      if: inputs.hydra == 'true' && steps.hydra-skip.outputs.should_skip != 'true'
      shell: bash
      env:
        PNAME: ${{ inputs.pname }}
      run: |
        nix run 'github:NixOS/nixpkgs/nixpkgs-unstable#hydra-check' -- --json --channel=nixpkgs-unstable --eval "$PNAME" | tee raw_hydra.json
        jq --from-file "${{ github.action_path }}/normalize-hydra-eval.jq" raw_hydra.json | tee normalized_hydra.json
        if jq -e '.[] | select(.severity == "error")' normalized_hydra.json > hydra_errors.jsonl; then
          echo "::error::Hydra check failed for $PNAME"
          cat hydra_errors.jsonl
          exit 1
        fi

    # Service 2: nixpkgs-update
    - name: nixpkgs-update skip status
      if: inputs.nixpkgs-update == 'true'
      id: update-skip
      shell: bash
      env:
        PNAME: ${{ inputs.pname }}
        CONFIG: ${{ inputs.config }}
      run: |
        if [[ -f "$CONFIG" ]]; then
          json=$("${{ github.action_path }}/check-skip.bash" --pname "$PNAME" --service "nixpkgs-update" --config "$CONFIG")
          if [[ $(echo "$json" | jq -r .skip) == "true" ]]; then
             echo "Skipping $PNAME for nixpkgs-update. Reason: $(echo "$json" | jq -r .reason)"
             echo "should_skip=true" >> "$GITHUB_OUTPUT"
          fi
        fi

    - name: Run nixpkgs-update-log-checker
      if: inputs.nixpkgs-update == 'true' && steps.update-skip.outputs.should_skip != 'true'
      shell: bash
      env:
        PNAME: ${{ inputs.pname }}
      run: |
        nix run 'github:kachick/nixpkgs-update-log-checker' -- --packages "$PNAME"
