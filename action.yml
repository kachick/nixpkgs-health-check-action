name: 'Nixpkgs Health Check'
description: 'Checks the health of a Nixpkgs package using hydra-check or nixpkgs-update logs'
author: 'kachick'
inputs:
  pname:
    description: 'Package name in Nixpkgs'
    required: true
  hydra:
    description: 'Whether to run Hydra check'
    default: 'true'
    required: false
  nixpkgs-update:
    description: 'Whether to run nixpkgs-update check'
    default: 'true'
    required: false
  config:
    description: 'Path to the skip-list configuration file'
    default: 'nixpkgs-health-check.toml'
    required: false
outputs:
  hydra_skipped:
    description: 'Whether hydra check was skipped'
    value: ${{ steps.check-skip.outputs.hydra_skipped }}
  nixpkgs_update_skipped:
    description: 'Whether nixpkgs-update check was skipped'
    value: ${{ steps.check-skip.outputs.nixpkgs_update_skipped }}
runs:
  using: 'composite'
  steps:
    - name: Check skip status
      id: check-skip
      shell: bash
      env:
        PNAME: ${{ inputs.pname }}
        CONFIG: ${{ inputs.config }}
      run: |
        # Initialize outputs
        echo "hydra_skipped=false" >> "$GITHUB_OUTPUT"
        echo "nixpkgs_update_skipped=false" >> "$GITHUB_OUTPUT"

        if [[ -f "$CONFIG" ]]; then
          # Check Hydra skip status
          json_hydra=$("${{ github.action_path }}/check-skip.bash" --pname "$PNAME" --service "hydra" --config "$CONFIG")
          hydra_skipped=$(echo "$json_hydra" | jq -r .skip)
          echo "hydra_skipped=$hydra_skipped" >> "$GITHUB_OUTPUT"

          if [[ "$hydra_skipped" == "true" ]]; then
             echo "Skipping $PNAME for hydra. Reason: $(echo "$json_hydra" | jq -r .reason)"
          fi

          # Check nixpkgs-update skip status
          json_update=$("${{ github.action_path }}/check-skip.bash" --pname "$PNAME" --service "nixpkgs-update" --config "$CONFIG")
          update_skipped=$(echo "$json_update" | jq -r .skip)
          echo "nixpkgs_update_skipped=$update_skipped" >> "$GITHUB_OUTPUT"

          if [[ "$update_skipped" == "true" ]]; then
             echo "Skipping $PNAME for nixpkgs-update. Reason: $(echo "$json_update" | jq -r .reason)"
          fi
        fi

    - name: Run hydra-check
      if: inputs.hydra == 'true' && steps.check-skip.outputs.hydra_skipped != 'true'
      shell: bash
      env:
        PNAME: ${{ inputs.pname }}
      run: |
        nix run 'github:NixOS/nixpkgs/nixpkgs-unstable#hydra-check' -- --json --channel=nixpkgs-unstable --eval "$PNAME" | tee raw_hydra.json
        jq --from-file "${{ github.action_path }}/normalize-hydra-eval.jq" raw_hydra.json | tee normalized_hydra.json
        if jq -e '.[] | select(.severity == "error")' normalized_hydra.json > hydra_errors.jsonl; then
          echo "::error::Hydra check failed for $PNAME"
          cat hydra_errors.jsonl
          exit 1
        fi

    - name: Run nixpkgs-update-log-checker
      if: inputs.nixpkgs-update == 'true' && steps.check-skip.outputs.nixpkgs_update_skipped != 'true'
      shell: bash
      env:
        PNAME: ${{ inputs.pname }}
      run: |
        nix run 'github:kachick/nixpkgs-update-log-checker' -- --packages "$PNAME"
