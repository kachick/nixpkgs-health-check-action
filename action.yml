name: 'Nixpkgs Health Check'
description: 'Checks the health of a Nixpkgs package using hydra-check or nixpkgs-update logs'
author: 'kachick'
inputs:
  pname:
    description: 'Package name in Nixpkgs'
    required: true
  service:
    description: 'Service to check (hydra or nixpkgs-update)'
    required: true
  config:
    description: 'Path to the skip-list configuration file'
    default: 'nixpkgs-health-check.toml'
    required: false
runs:
  using: 'composite'
  steps:
    - name: Check skip status
      id: check-skip
      shell: bash
      env:
        PNAME: ${{ inputs.pname }}
        CONFIG: ${{ inputs.config }}
        SERVICE: ${{ inputs.service }}
      run: |
        # Only run check-skip.bash if CONFIG file exists
        if [[ -f "$CONFIG" ]]; then
          json=$("${{ github.action_path }}/check-skip.bash" --pname "$PNAME" --service "$SERVICE" --config "$CONFIG")
          skipped=$(echo "$json" | jq -r .skip)
          reason=$(echo "$json" | jq -r .reason)

          echo "should_skip=$skipped" >> "$GITHUB_OUTPUT"
          if [[ "$skipped" == "true" ]]; then
             echo "Skipping $PNAME for $SERVICE. Reason: $reason"
          fi
        else
          echo "should_skip=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Run hydra-check
      if: inputs.service == 'hydra' && steps.check-skip.outputs.should_skip != 'true'
      shell: bash
      env:
        PNAME: ${{ inputs.pname }}
      run: |
        nix run 'github:NixOS/nixpkgs/nixpkgs-unstable#hydra-check' -- --json --channel=nixpkgs-unstable --eval "$PNAME" | tee raw_hydra.json
        jq --from-file "${{ github.action_path }}/normalize-hydra-eval.jq" raw_hydra.json | tee normalized_hydra.json
        if jq -e '.[] | select(.severity == "error")' normalized_hydra.json > hydra_errors.jsonl; then
          echo "::error::Hydra check failed for $PNAME"
          cat hydra_errors.jsonl
          exit 1
        fi

    - name: Run nixpkgs-update-log-checker
      if: inputs.service == 'nixpkgs-update' && steps.check-skip.outputs.should_skip != 'true'
      shell: bash
      env:
        PNAME: ${{ inputs.pname }}
      run: |
        nix run 'github:kachick/nixpkgs-update-log-checker' -- --packages "$PNAME"
