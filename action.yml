name: 'Nixpkgs Health Check'
description: 'Checks the health of a Nixpkgs package using hydra-check and nixpkgs-update logs'
author: 'kachick'
inputs:
  pname:
    description: 'Package name in Nixpkgs'
    required: true
  hydra:
    description: 'Whether to run Hydra check'
    default: 'true'
    required: false
  nixpkgs-update:
    description: 'Whether to run nixpkgs-update check'
    default: 'true'
    required: false
  config:
    description: 'Path to the skip-list configuration file (optional for single package checks)'
    default: ''
    required: false
runs:
  using: 'composite'
  steps:
    - name: Check skip status from config
      if: inputs.config != ''
      id: check-skip
      shell: bash
      env:
        PNAME: ${{ inputs.pname }}
        CONFIG: ${{ inputs.config }}
      run: |
        # Check Hydra skip status from config
        json_hydra=$("${{ github.action_path }}/check-skip.bash" --pname "$PNAME" --service "hydra" --config "$CONFIG")
        echo "hydra_config_skip=$(echo "$json_hydra" | jq -r .skip)" >> "$GITHUB_OUTPUT"
        echo "hydra_reason=$(echo "$json_hydra" | jq -r .reason)" >> "$GITHUB_OUTPUT"

        # Check nixpkgs-update skip status from config
        json_update=$("${{ github.action_path }}/check-skip.bash" --pname "$PNAME" --service "nixpkgs-update" --config "$CONFIG")
        echo "update_config_skip=$(echo "$json_update" | jq -r .skip)" >> "$GITHUB_OUTPUT"
        echo "update_reason=$(echo "$json_update" | jq -r .reason)" >> "$GITHUB_OUTPUT"

    - name: Evaluate final skip status
      id: final-status
      shell: bash
      env:
        HYDRA_INPUT: ${{ inputs.hydra }}
        UPDATE_INPUT: ${{ inputs.nixpkgs-update }}
        HYDRA_CONFIG_SKIP: ${{ steps.check-skip.outputs.hydra_config_skip }}
        UPDATE_CONFIG_SKIP: ${{ steps.check-skip.outputs.update_config_skip }}
      run: |
        # Hydra should run if input is true AND config doesn't skip it
        if [[ "$HYDRA_INPUT" == "true" && "$HYDRA_CONFIG_SKIP" != "true" ]]; then
          echo "run_hydra=true" >> "$GITHUB_OUTPUT"
        else
          echo "run_hydra=false" >> "$GITHUB_OUTPUT"
        fi

        # nixpkgs-update should run if input is true AND config doesn't skip it
        if [[ "$UPDATE_INPUT" == "true" && "$UPDATE_CONFIG_SKIP" != "true" ]]; then
          echo "run_update=true" >> "$GITHUB_OUTPUT"
        else
          echo "run_update=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Run hydra-check
      if: steps.final-status.outputs.run_hydra == 'true'
      shell: bash
      env:
        PNAME: ${{ inputs.pname }}
      run: |
        nix run 'github:NixOS/nixpkgs/nixpkgs-unstable#hydra-check' -- --json --channel=nixpkgs-unstable --eval "$PNAME" | tee raw_hydra.json

    - name: Normalize Hydra result
      if: steps.final-status.outputs.run_hydra == 'true'
      shell: bash
      run: |
        jq --from-file "${{ github.action_path }}/normalize-hydra-eval.jq" raw_hydra.json | tee normalized_hydra.json

    - name: Report Hydra errors
      if: steps.final-status.outputs.run_hydra == 'true'
      shell: bash
      env:
        PNAME: ${{ inputs.pname }}
      run: |
        if jq -e '.[] | select(.severity == "error")' normalized_hydra.json > hydra_errors.jsonl; then
          echo "::error::Hydra check failed for $PNAME"
          cat hydra_errors.jsonl
          exit 1
        fi

    - name: Run nixpkgs-update-log-checker
      if: steps.final-status.outputs.run_update == 'true'
      shell: bash
      env:
        PNAME: ${{ inputs.pname }}
      run: |
        nix run 'github:kachick/nixpkgs-update-log-checker' -- --packages "$PNAME"
