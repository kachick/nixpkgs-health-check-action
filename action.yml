name: 'Nixpkgs Health Check'
description: 'Checks the health of Nixpkgs packages using hydra-check and nixpkgs-update logs, and optionally updates a GitHub Dashboard Issue'
inputs:
  pname:
    description: 'Single package name in Nixpkgs'
    default: ''
    required: false
  pnames:
    description: 'JSON array of package names in Nixpkgs'
    default: ''
    required: false
  hydra:
    description: 'Whether to run Hydra check'
    default: 'true'
    required: false
  nixpkgs-update:
    description: 'Whether to run nixpkgs-update check'
    default: 'true'
    required: false
  config:
    description: 'Path to the configuration file for skipping or ignoring checks'
    default: ''
    required: false
  concurrency:
    description: 'Maximum number of packages to check in parallel'
    default: '4'
    required: false
  dashboard-id:
    description: 'Dashboard identifier; when non-empty, upserts a GitHub Dashboard Issue'
    default: ''
    required: false
  dashboard-title:
    description: 'Title for the Dashboard Issue'
    default: ''
    required: false
  assignee:
    description: 'GitHub username to assign when errors are present'
    default: ''
    required: false
  token:
    description: 'GitHub token with issues:write permission (required only when dashboard-id is set)'
    default: ''
    required: false
runs:
  using: 'composite'
  steps:
    - name: Run nixpkgs-health-check
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        PNAME: ${{ inputs.pname }}
        PNAMES: ${{ inputs.pnames }}
        RUN_HYDRA: ${{ inputs.hydra }}
        RUN_UPDATE: ${{ inputs.nixpkgs-update }}
        CONFIG: ${{ inputs.config }}
        CONCURRENCY: ${{ inputs.concurrency }}
        DASHBOARD_ID: ${{ inputs.dashboard-id }}
        DASHBOARD_TITLE: ${{ inputs.dashboard-title }}
        ASSIGNEE: ${{ inputs.assignee }}
        GITHUB_TOKEN: ${{ inputs.token }}
      run: |
        args=(
          "--hydra=$RUN_HYDRA"
          "--nixpkgs-update=$RUN_UPDATE"
          "--concurrency=$CONCURRENCY"
        )
        if [[ -n "$CONFIG" ]]; then
          args+=("--config=$CONFIG")
        fi
        if [[ -n "$DASHBOARD_ID" ]]; then
          args+=("--dashboard-id=$DASHBOARD_ID")
        fi
        if [[ -n "$DASHBOARD_TITLE" ]]; then
          args+=("--dashboard-title=$DASHBOARD_TITLE")
        fi
        if [[ -n "$ASSIGNEE" ]]; then
          args+=("--assignee=$ASSIGNEE")
        fi
        if [[ "$RUN_UPDATE" == "true" ]]; then
          # Resolve nixpkgs-update-log-checker once so parallel package checks reuse the same binary.
          checker_out=$(nix build --no-link --print-out-paths 'github:kachick/nixpkgs-update-log-checker')
          args+=("--update-checker-bin=$checker_out/bin/nixpkgs-update-log-checker")
        fi
        if [[ -n "$PNAMES" ]]; then
          args+=("--pnames-json=$PNAMES")
        fi
        if [[ -n "$PNAME" ]]; then
          args+=("$PNAME")
        fi

        nix run "${ACTION_PATH}#nixpkgs-health-check" -- "${args[@]}"
