name: 'Nixpkgs Health Check'
description: 'Checks the health of a Nixpkgs package using hydra-check and nixpkgs-update logs'
inputs:
  pname:
    description: 'Package name in Nixpkgs'
    required: true
  hydra:
    description: 'Whether to run Hydra check'
    default: 'true'
    required: false
  nixpkgs-update:
    description: 'Whether to run nixpkgs-update check'
    default: 'true'
    required: false
  config:
    description: 'Path to the configuration file for ignoring checks'
    default: ''
    required: false
runs:
  using: 'composite'
  steps:
    - name: Run hydra-check
      if: inputs.hydra == 'true'
      shell: bash
      env:
        PNAME: ${{ inputs.pname }}
        CONFIG: ${{ inputs.config }}
      run: |
        if [[ -n "$CONFIG" && -f "$CONFIG" ]]; then
          nix run .#nixpkgs-health-check-hydra -- --config "$CONFIG" "$PNAME"
        else
          nix run .#nixpkgs-health-check-hydra -- "$PNAME"
        fi

    - name: Run nixpkgs-update-log-checker
      if: inputs.nixpkgs-update == 'true'
      shell: bash
      env:
        PNAME: ${{ inputs.pname }}
        CONFIG: ${{ inputs.config }}
      run: |
        if [[ -n "$CONFIG" && -f "$CONFIG" ]]; then
          update_config=$(mktemp)
          trap 'rm -f "$update_config"' EXIT
          nix run .#extract-nixpkgs-update-config -- "$CONFIG" > "$update_config"
          nix run 'github:kachick/nixpkgs-update-log-checker' -- --packages "$PNAME" --config "$update_config"
        else
          nix run 'github:kachick/nixpkgs-update-log-checker' -- --packages "$PNAME"
        fi
