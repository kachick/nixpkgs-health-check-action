name: 'Nixpkgs Health Check Planner'
description: 'Plans the execution matrix by filtering packages against the skip-list'
inputs:
  maintainer:
    description: 'Maintainer ID'
    required: false
  pnames:
    description: 'JSON list of package names'
    required: false
  config:
    description: 'Path to the skip-list configuration file'
    required: true
outputs:
  matrix:
    description: 'JSON list of package names to execute'
    value: ${{ steps.generate.outputs.matrix }}
runs:
  using: 'composite'
  steps:
    - name: Generate matrix
      id: generate
      shell: bash
      env:
        MAINTAINER: ${{ inputs.maintainer }}
        PNAMES: ${{ inputs.pnames }}
        CONFIG: ${{ inputs.config }}
      run: |
        if [[ -n "$MAINTAINER" ]]; then
          pnames=$(nix run github:kachick/nixpkgs-maintained-by -- -id "$MAINTAINER" -json)
        else
          pnames="$PNAMES"
        fi

        echo '[]' > matrix.json
        for pname in $(echo "$pnames" | jq -r '.[]'); do
          # A package should be included if ANY of its services are not skipped
          if [[ -f "$CONFIG" ]]; then
            hydra_skip=$(./.health-check-action/check-skip.bash --pname "$pname" --service "hydra" --config "$CONFIG" | jq -r .skip)
            update_skip=$(./.health-check-action/check-skip.bash --pname "$pname" --service "nixpkgs-update" --config "$CONFIG" | jq -r .skip)
          else
            hydra_skip="false"
            update_skip="false"
          fi

          if [[ "$hydra_skip" != "true" || "$update_skip" != "true" ]]; then
            tmp=$(mktemp)
            jq -c --arg p "$pname" '. += [$p]' matrix.json > "$tmp" && mv "$tmp" matrix.json
          fi
        done

        echo "matrix=$(cat matrix.json | jq -c .)" >> "$GITHUB_OUTPUT"
