name: 'Nixpkgs Health Check Planner'
description: 'Plans the execution matrix by filtering packages against the skip-list'
inputs:
  maintainer:
    description: 'Maintainer ID'
    required: false
  pnames:
    description: 'JSON list of package names'
    required: false
  config:
    description: 'Path to the skip-list configuration file'
    required: true
outputs:
  matrix:
    description: 'Flat JSON list of {pname, service} objects to execute'
    value: ${{ steps.generate.outputs.matrix }}
runs:
  using: 'composite'
  steps:
    - name: Generate matrix
      id: generate
      shell: bash
      env:
        MAINTAINER: ${{ inputs.maintainer }}
        PNAMES: ${{ inputs.pnames }}
        CONFIG: ${{ inputs.config }}
      run: |
        if [[ -n "$MAINTAINER" ]]; then
          pnames=$(nix run github:kachick/nixpkgs-maintained-by -- -id "$MAINTAINER" -json)
        else
          pnames="$PNAMES"
        fi

        echo '[]' > matrix.json
        for pname in $(echo "$pnames" | jq -r '.[]'); do
          for service in "hydra" "nixpkgs-update"; do
            if [[ -f "$CONFIG" ]]; then
              skip=$(./.health-check-action/check-skip.bash --pname "$pname" --service "$service" --config "$CONFIG" | jq -r .skip)
            else
              skip="false"
            fi

            if [[ "$skip" != "true" ]]; then
              tmp=$(mktemp)
              jq -c --arg p "$pname" --arg s "$service" '. += [{pname: $p, service: $s}]' matrix.json > "$tmp" && mv "$tmp" matrix.json
            fi
          done
        done

        echo "matrix=$(cat matrix.json | jq -c .)" >> "$GITHUB_OUTPUT"
