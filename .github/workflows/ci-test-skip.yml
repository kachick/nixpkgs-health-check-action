name: CI Test Runner Logic
on:
  pull_request:
    paths:
      - '.github/workflows/health-check.yml'
      - '.github/workflows/ci-test-skip.yml'

permissions:
  contents: read

jobs:
  test-skip-hydra:
    uses: ./.github/workflows/health-check.yml
    with:
      pname: 'hello'
      hydra: false
      nixpkgs-update: true

  assert-hydra-skipped:
    needs: test-skip-hydra
    runs-on: ubuntu-latest
    steps:
      - name: Check result
        env:
          JOB_RESULT: ${{ needs.test-skip-hydra.result }}
        run: |
          echo "Job result: $JOB_RESULT"
          # In GHA, if a job is skipped via 'if', it doesn't appear in needs
          # But since we use nested workflows, we can check the overall success
          # and manually verify in UI that only nixpkgs-update ran.

  test-run-all:
    uses: ./.github/workflows/health-check.yml
    with:
      pname: 'biz-ud-gothic'
      hydra: true
      nixpkgs-update: true
