name: CI Test Skip Logic
on:
  pull_request:
    paths:
      - '.github/workflows/health-check.yml'
      - '.github/workflows/ci-test-skip.yml'

permissions:
  contents: read

jobs:
  test-skip-hydra:
    name: Verify hydra skip flag
    uses: ./.github/workflows/health-check.yml
    with:
      pname: 'hello'
      hydra: false
      nixpkgs-update: true

  assert-hydra-skipped:
    needs: test-skip-hydra
    runs-on: ubuntu-latest
    steps:
      - name: Check result
        env:
          HYDRA_RESULT: ${{ needs.test-skip-hydra.outputs.hydra_skipped }}
        run: |
          echo "Hydra job result (via outputs): $HYDRA_RESULT"
          # health-check.yml should still provide outputs for verification in this test.

  test-run-all:
    name: Verify real package execution
    uses: ./.github/workflows/health-check.yml
    with:
      pname: 'biz-ud-gothic'
      hydra: true
      nixpkgs-update: true

  assert-real-ran:
    needs: test-run-all
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check result
        env:
          JOB_RESULT: ${{ needs.test-run-all.result }}
        run: |
          echo "Job Result: $JOB_RESULT"
          if [[ "$JOB_RESULT" != "success" ]]; then
             echo "Error: Real test job failed or was skipped unexpectedly."
             exit 1
          fi
