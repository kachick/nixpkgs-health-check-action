name: CI Test Skip Logic
on:
  pull_request:
    paths:
      - '.github/workflows/health-check.yml'
      - 'check-skip.nix'
      - 'nixpkgs-health-check.toml'
      - '.github/workflows/ci-test-skip.yml'

permissions:
  contents: read

jobs:
  test-skip-hello:
    uses: ./.github/workflows/health-check.yml
    with:
      pname: 'hello'
      config: 'nixpkgs-health-check.toml'

  assert-hello-skipped:
    needs: test-skip-hello
    runs-on: ubuntu-latest
    steps:
      - name: Check outputs
        env:
          HYDRA_SKIPPED: ${{ needs.test-skip-hello.outputs.hydra_skipped }}
          NIXPKGS_UPDATE_SKIPPED: ${{ needs.test-skip-hello.outputs.nixpkgs_update_skipped }}
        run: |
          echo "Hydra skipped: $HYDRA_SKIPPED"
          echo "Nixpkgs-update skipped: $NIXPKGS_UPDATE_SKIPPED"

          if [[ "$HYDRA_SKIPPED" != "true" ]]; then
            echo "Error: Hydra check should have been skipped for 'hello'"
            exit 1
          fi

          if [[ "$NIXPKGS_UPDATE_SKIPPED" != "true" ]]; then
            echo "Error: Nixpkgs-update check should have been skipped for 'hello'"
            exit 1
          fi

  test-run-real:
    uses: ./.github/workflows/health-check.yml
    with:
      pname: 'biz-ud-gothic'
      config: 'nixpkgs-health-check.toml'

  assert-real-ran:
    needs: test-run-real
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check outputs
        env:
          # Verify that it RAN (i.e. skipped is NOT true)
          HYDRA_SKIPPED: ${{ needs.test-run-real.outputs.hydra_skipped }}
          NIXPKGS_UPDATE_SKIPPED: ${{ needs.test-run-real.outputs.nixpkgs_update_skipped }}
          JOB_RESULT: ${{ needs.test-run-real.result }}
        run: |
          echo "Hydra skipped: $HYDRA_SKIPPED"
          echo "Nixpkgs-update skipped: $NIXPKGS_UPDATE_SKIPPED"
          echo "Job Result: $JOB_RESULT"

          if [[ "$HYDRA_SKIPPED" == "true" ]]; then
             echo "Error: Hydra check should NOT have been skipped for 'biz-ud-gothic'"
             exit 1
          fi

          if [[ "$NIXPKGS_UPDATE_SKIPPED" == "true" ]]; then
             echo "Error: Nixpkgs-update check should NOT have been skipped for 'biz-ud-gothic'"
             exit 1
          fi

          # If the job was cancelled or skipped (workflow level), we should know.
          if [[ "$JOB_RESULT" == "skipped" || "$JOB_RESULT" == "cancelled" ]]; then
             echo "Error: Real test job was skipped or cancelled unexpectedly."
             exit 1
          fi
