name: 'Nixpkgs health checks'
on:
  workflow_call:
    inputs:
      pname:
        required: true
        type: string
      hydra:
        required: false
        type: boolean
        default: true
      nixpkgs-update:
        required: false
        type: boolean
        default: true
      config:
        required: false
        type: string
        default: 'nixpkgs-health-check.toml'

defaults:
  run:
    shell: bash

jobs:
  hydra:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: cachix/install-nix-action@4e002c8ec80594ecd40e759629461e26c8abed15 # v31.9.0
        with:
          # Enable accept-flake-config for using the garnix
          extra_nix_config: |
            sandbox = true
            accept-flake-config = true
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./
        id: action
        with:
          pname: ${{ inputs.pname }}
          hydra: ${{ inputs.hydra }}
          nixpkgs-update: false # Specifically only run hydra in this job
          config: ${{ inputs.config }}

  nixpkgs-update:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: cachix/install-nix-action@4e002c8ec80594ecd40e759629461e26c8abed15 # v31.9.0
        with:
          # Enable accept-flake-config for using the garnix
          extra_nix_config: |
            sandbox = true
            accept-flake-config = true
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./
        id: action
        with:
          pname: ${{ inputs.pname }}
          hydra: false # Specifically only run update in this job
          nixpkgs-update: ${{ inputs.nixpkgs-update }}
          config: ${{ inputs.config }}
