name: 'Nixpkgs health checks'
on:
  workflow_call:
    inputs:
      pname:
        required: true
        type: string
      config:
        required: false
        type: string
        default: 'nixpkgs-health-check.toml'
    outputs:
      hydra_skipped:
        description: 'Whether hydra check was skipped'
        value: ${{ jobs.hydra.outputs.skipped }}
      nixpkgs_update_skipped:
        description: 'Whether nixpkgs-update check was skipped'
        value: ${{ jobs.nixpkgs-update.outputs.skipped }}

defaults:
  run:
    shell: bash

jobs:
  hydra:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      skipped: ${{ steps.action.outputs.hydra_skipped }}
    steps:
      - uses: cachix/install-nix-action@4e002c8ec80594ecd40e759629461e26c8abed15 # v31.9.0
        with:
          # Enable accept-flake-config for using the garnix
          extra_nix_config: |
            sandbox = true
            accept-flake-config = true
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./
        id: action
        with:
          pname: ${{ inputs.pname }}
          hydra: true
          nixpkgs-update: false
          config: ${{ inputs.config }}

  nixpkgs-update:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      skipped: ${{ steps.action.outputs.nixpkgs_update_skipped }}
    steps:
      - uses: cachix/install-nix-action@4e002c8ec80594ecd40e759629461e26c8abed15 # v31.9.0
        with:
          # Enable accept-flake-config for using the garnix
          extra_nix_config: |
            sandbox = true
            accept-flake-config = true
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./
        id: action
        with:
          pname: ${{ inputs.pname }}
          hydra: false
          nixpkgs-update: true
          config: ${{ inputs.config }}
