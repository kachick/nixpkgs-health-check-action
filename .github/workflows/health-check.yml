name: health-check

on:
  workflow_call:
    inputs:
      pnames:
        description: 'JSON array of package names'
        required: true
        type: string
      config:
        description: 'Path to the configuration file for skipping checks'
        required: true
        type: string
        default: 'nixpkgs-health-check-by-maintainer.toml'

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: '${{ steps.generate.outputs.matrix }}'
    steps:
      - uses: cachix/install-nix-action@4e002c8ec80594ecd40e759629461e26c8abed15 # v31.9.0
        with:
          nix_path: 'nixpkgs=channel:nixpkgs-unstable'
          extra_nix_config: |
            sandbox = true
            accept-flake-config = true
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Checkout health-check scripts
        uses: actions/checkout@v6
        with:
          repository: kachick/nixpkgs-health-check-action
          path: .health-check-action
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Generate matrix
        id: generate
        env:
          PNAMES: ${{ inputs.pnames }}
          CONFIG: ${{ inputs.config }}
        run: |
          echo '[]' > matrix.json
          for pname in $(echo "$PNAMES" | jq -r '.[]'); do
            if [[ -f "$CONFIG" ]]; then
              hydra_skip=$(./.health-check-action/check-skip.bash --pname "$pname" --service "hydra" --config "$CONFIG" | jq -r .skip)
              update_skip=$(./.health-check-action/check-skip.bash --pname "$pname" --service "nixpkgs-update" --config "$CONFIG" | jq -r .skip)
            else
              hydra_skip="false"; update_skip="false"
            fi

            # Include package if NOT skipped for ALL services
            if [[ "$hydra_skip" != "true" || "$update_skip" != "true" ]]; then
              tmp=$(mktemp)
              jq -c --arg p "$pname" \
                 --arg run_hydra "$([[ "$hydra_skip" != "true" ]] && echo true || echo false)" \
                 --arg run_update "$([[ "$update_skip" != "true" ]] && echo true || echo false)" \
                 '. += [{pname: $p, run_hydra: ($run_hydra == "true"), run_update: ($run_update == "true")}]' \
                 matrix.json > "$tmp" && mv "$tmp" matrix.json
            fi
          done
          echo "matrix=$(cat matrix.json | jq -c .)" >> "$GITHUB_OUTPUT"

  check:
    needs: [plan]
    if: fromJson(needs.plan.outputs.matrix)[0] != null
    name: ${{ matrix.item.pname }}
    strategy:
      fail-fast: false
      matrix:
        item: '${{ fromJson(needs.plan.outputs.matrix) }}'
    runs-on: ubuntu-24.04
    steps:
      - uses: cachix/install-nix-action@4e002c8ec80594ecd40e759629461e26c8abed15 # v31.9.0
        with:
          nix_path: 'nixpkgs=channel:nixpkgs-unstable'
          extra_nix_config: |
            sandbox = true
            accept-flake-config = true
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Run health checks
        uses: ./
        with:
          pname: ${{ matrix.item.pname }}
          hydra: ${{ matrix.item.run_hydra }}
          nixpkgs-update: ${{ matrix.item.run_update }}
