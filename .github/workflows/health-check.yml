name: health-check

on:
  workflow_call:
    inputs:
      pnames:
        description: 'JSON array of package names'
        required: true
        type: string
      config:
        description: 'Path to the configuration file for skipping checks'
        required: true
        type: string
        default: 'nixpkgs-health-check-by-maintainer.toml'

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  plan:
    runs-on: ubuntu-26.04
    outputs:
      matrix: '${{ steps.plan.outputs.matrix }}'
    steps:
      - uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c # v31.10.7
        with:
          extra_nix_config: |
            sandbox = true
            accept-flake-config = true
      - uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false
      - name: Plan execution
        id: plan
        uses: ./.github/actions/plan
        env:
          NIX_PATH: nixpkgs=channel:nixpkgs-unstable
        with:
          pnames: ${{ inputs.pnames }}
          config: ${{ inputs.config }}

  check:
    needs: [plan]
    if: fromJson(needs.plan.outputs.matrix)[0] != null
    name: ${{ matrix.item.pname }}
    strategy:
      fail-fast: false
      matrix:
        item: '${{ fromJson(needs.plan.outputs.matrix) }}'
    runs-on: ubuntu-26.04
    steps:
      - uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c # v31.10.7
        with:
          extra_nix_config: |
            sandbox = true
            accept-flake-config = true
      - uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false
      - name: Run health checks
        env:
          NIX_PATH: nixpkgs=channel:nixpkgs-unstable
        uses: ./
        with:
          pname: ${{ matrix.item.pname }}
          hydra: ${{ matrix.item.run_hydra }}
          nixpkgs-update: ${{ matrix.item.run_update }}
