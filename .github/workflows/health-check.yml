name: 'Nixpkgs health checks'
on:
  workflow_call:
    inputs:
      pname:
        required: true
        type: string
      hydra:
        required: false
        type: boolean
        default: true
      nixpkgs-update:
        required: false
        type: boolean
        default: true
    outputs:
      hydra_skipped:
        description: 'Whether hydra check was skipped'
        value: ${{ jobs.hydra.result == 'skipped' }}
      nixpkgs_update_skipped:
        description: 'Whether nixpkgs-update check was skipped'
        value: ${{ jobs.nixpkgs-update.result == 'skipped' }}

defaults:
  run:
    shell: bash

jobs:
  hydra:
    if: inputs.hydra
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: cachix/install-nix-action@4e002c8ec80594ecd40e759629461e26c8abed15 # v31.9.0
        with:
          extra_nix_config: |
            sandbox = true
            accept-flake-config = true
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Run hydra check action
        uses: ./.github/actions/hydra
        with:
          pname: ${{ inputs.pname }}

  nixpkgs-update:
    if: inputs.nixpkgs-update
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: cachix/install-nix-action@4e002c8ec80594ecd40e759629461e26c8abed15 # v31.9.0
        with:
          extra_nix_config: |
            sandbox = true
            accept-flake-config = true
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Run nixpkgs-update check action
        uses: ./.github/actions/nixpkgs-update
        with:
          pname: ${{ inputs.pname }}
