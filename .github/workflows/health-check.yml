name: 'Nixpkgs health checks'
on:
  workflow_call:
    inputs:
      pname:
        required: true
        type: string
      config:
        required: false
        type: string
        default: 'nixpkgs-health-check.toml'
    outputs:
      # Outputs are less necessary with matrix jobs as UI shows individual results,
      # but we can still expose them if needed. For now, let's keep it clean.
      hydra_skipped:
        description: 'Whether hydra check was skipped (only from hydra job)'
        value: ${{ jobs.check.outputs.skipped }}

defaults:
  run:
    shell: bash

jobs:
  check:
    name: ${{ matrix.service }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        service: [hydra, nixpkgs-update]
    steps:
      - uses: cachix/install-nix-action@4e002c8ec80594ecd40e759629461e26c8abed15 # v31.9.0
        with:
          # Enable accept-flake-config for using the garnix
          extra_nix_config: |
            sandbox = true
            accept-flake-config = true
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./ # Uses local action for internal/nested call
        with:
          pname: ${{ inputs.pname }}
          service: ${{ matrix.service }}
          config: ${{ inputs.config }}
