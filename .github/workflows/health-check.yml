name: health-check

on:
  workflow_call:
    inputs:
      pnames:
        description: 'JSON array of package names'
        required: true
        type: string
      config:
        description: 'Path to the configuration file for skipping checks'
        required: true
        type: string
        default: 'nixpkgs-health-check-by-maintainer.toml'

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-26.04
    outputs:
      matrix: '${{ steps.plan.outputs.matrix }}'
    steps:
      - uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6 # v1.0.0
        with:
          # access-tokens: Prevent GitHub API rate limiting during `nix run github:`
          extra-conf: |
            access-tokens = github.com=${{ github.token }}
            extra-substituters = https://kachick.cachix.org
            extra-trusted-public-keys = kachick.cachix.org-1:7giZGKW03gPFkbde09JNpDKCbDGGwBuU/Z11W/jUtEQ=
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Plan execution
        id: plan
        uses: $/.github/actions/plan
        env:
          NIX_PATH: nixpkgs=channel:nixpkgs-unstable
        with:
          pnames: ${{ inputs.pnames }}
          config: ${{ inputs.config }}

  check:
    needs: [plan]
    if: fromJson(needs.plan.outputs.matrix)[0] != null
    name: ${{ matrix.item.pname }}
    strategy:
      fail-fast: false
      matrix:
        item: '${{ fromJson(needs.plan.outputs.matrix) }}'
    runs-on: ubuntu-26.04
    steps:
      - uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6 # v1.0.0
        with:
          # access-tokens: Prevent GitHub API rate limiting during `nix run github:`
          extra-conf: |
            access-tokens = github.com=${{ github.token }}
            extra-substituters = https://kachick.cachix.org
            extra-trusted-public-keys = kachick.cachix.org-1:7giZGKW03gPFkbde09JNpDKCbDGGwBuU/Z11W/jUtEQ=
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run health checks
        env:
          NIX_PATH: nixpkgs=channel:nixpkgs-unstable
        uses: $/
        with:
          pname: ${{ matrix.item.pname }}
          hydra: ${{ matrix.item.run_hydra }}
          nixpkgs-update: ${{ matrix.item.run_update }}
          config: ${{ inputs.config }}
