name: 🧪

on:
  pull_request:
    paths:
      - '.github/workflows/health-check*'
      - '.github/actions/**'
      - 'check-skip.*'
      - 'nixpkgs-health-check-by-maintainer.toml'

permissions:
  contents: read

jobs:
  # Job 1: Verify the Decision Maker logic (Skip-list filtering and UI naming)
  verify-plan:
    name: 🧪 verify skip logic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@4e002c8ec80594ecd40e759629461e26c8abed15 # v31.9.0
        with:
          nix_path: 'nixpkgs=channel:nixpkgs-unstable'
      - name: Run plan action directly
        id: plan
        uses: ./.github/actions/plan
        with:
          pnames: '["hello", "biz-ud-gothic"]'
          config: 'nixpkgs-health-check-by-maintainer.toml'
      - name: Assertions
        env:
          HYDRA_JSON: ${{ steps.plan.outputs.hydra_matrix }}
          UPDATE_JSON: ${{ steps.plan.outputs.update_matrix }}
        run: |
          echo "Generated Hydra Matrix: $HYDRA_JSON"
          echo "Generated Update Matrix: $UPDATE_JSON"

          # Helper to check if ID exists in the matrix
          exists() { echo "$1" | jq -e --arg id "$2" '.[] | select(.id == $id)' > /dev/null; }

          # 1. Assert 'hello' is REMOVED
          if exists "$HYDRA_JSON" "hydra / hello"; then echo "Error: hello should be skipped for hydra"; exit 1; fi
          if exists "$UPDATE_JSON" "update / hello"; then echo "Error: hello should be skipped for nixpkgs-update"; exit 1; fi

          # 2. Assert 'biz-ud-gothic' is INCLUDED with correct UI id
          if ! exists "$HYDRA_JSON" "hydra / biz-ud-gothic"; then echo "Error: biz-ud-gothic should be included for hydra"; exit 1; fi
          if ! exists "$UPDATE_JSON" "update / biz-ud-gothic"; then echo "Error: biz-ud-gothic should be included for nixpkgs-update"; exit 1; fi

          echo "Assertion passed: hello was correctly skipped, and biz-ud-gothic was correctly included with UI objects."

  # Job 2: Run the actual workflow to ensure it doesn't crash
  workflow-integration:
    needs: [verify-plan]
    uses: ./.github/workflows/health-check-by-list.yml
    with:
      pnames: '["hello", "biz-ud-gothic"]'
      config: 'nixpkgs-health-check-by-maintainer.toml'
