name: CI Runner Integration Test

on:
  pull_request:
    paths:
      - '.github/workflows/health-check*'
      - '.github/actions/**'
      - 'check-skip.*'
      - 'nixpkgs-health-check-by-maintainer.toml'

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: '${{ steps.generate-matrix.outputs.matrix }}'
    steps:
      - uses: cachix/install-nix-action@4e002c8ec80594ecd40e759629461e26c8abed15 # v31.9.0
        with:
          extra_nix_config: |
            sandbox = true
            accept-flake-config = true
      - name: Checkout health-check scripts
        uses: actions/checkout@v6
        with:
          repository: kachick/nixpkgs-health-check-action
          path: .health-check-action
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Checkout caller repo for config
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - id: generate-matrix
        run: |
          # Test with specific packages instead of full maintainer list
          pnames='["hello", "biz-ud-gothic"]'
          CONFIG="nixpkgs-health-check-by-maintainer.toml"

          echo '[]' > matrix.json
          for pname in $(echo "$pnames" | jq -r '.[]'); do
            hydra_skip=$(./.health-check-action/check-skip.bash --pname "$pname" --service "hydra" --config "$CONFIG" | jq -r .skip)
            update_skip=$(./.health-check-action/check-skip.bash --pname "$pname" --service "nixpkgs-update" --config "$CONFIG" | jq -r .skip)

            tmp=$(mktemp)
            jq --arg pname "$pname" 
               --arg run_hydra "$([[ "$hydra_skip" != "true" ]] && echo true || echo false)" 
               --arg run_update "$([[ "$update_skip" != "true" ]] && echo true || echo false)" 
               '. += [{pname: $pname, run_hydra: ($run_hydra == "true"), run_update: ($run_update == "true")}]' 
               matrix.json > "$tmp" && mv "$tmp" matrix.json
          done
          echo "matrix=$(cat matrix.json | jq -c .)" >> "$GITHUB_OUTPUT"

  check:
    needs: [plan]
    name: ${{ matrix.item.pname }}
    strategy:
      fail-fast: false
      matrix:
        item: '${{ fromJson(needs.plan.outputs.matrix) }}'
    uses: ./.github/workflows/health-check.yml
    with:
      pname: '${{ matrix.item.pname }}'
      hydra: ${{ matrix.item.run_hydra }}
      nixpkgs-update: ${{ matrix.item.run_update }}
