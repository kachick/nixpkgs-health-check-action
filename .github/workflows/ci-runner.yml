name: 🧪

on:
  pull_request:
    paths:
      - '.github/workflows/health-check*'
      - '.github/actions/**'
      - 'check-skip.*'
      - 'nixpkgs-health-check-by-maintainer.toml'

permissions:
  contents: read

jobs:
  # Job 1: Verify the Decision Maker logic (Skip-list filtering)
  verify-plan:
    name: 🧪 verify skip logic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@4e002c8ec80594ecd40e759629461e26c8abed15 # v31.9.0
        with:
          nix_path: 'nixpkgs=channel:nixpkgs-unstable'
      - name: Run plan action directly
        id: plan
        uses: ./.github/actions/plan
        with:
          pnames: '["hello", "biz-ud-gothic"]'
          config: 'nixpkgs-health-check-by-maintainer.toml'
      - name: Assertions
        env:
          MATRIX_JSON: ${{ steps.plan.outputs.matrix }}
        run: |
          echo "Generated Matrix: $MATRIX_JSON"

          # Helper to check if a specific pair exists
          exists() { echo "$1" | jq -e --arg p "$2" --arg s "$3" '.[] | select(.pname == $p and .service == $s)' > /dev/null; }

          # 1. Assert 'hello' is COMPLETELY REMOVED
          if exists "$MATRIX_JSON" "hello" "hydra"; then echo "Error: hello hydra should be skipped"; exit 1; fi
          if exists "$MATRIX_JSON" "hello" "nixpkgs-update"; then echo "Error: hello update should be skipped"; exit 1; fi

          # 2. Assert 'biz-ud-gothic' is INCLUDED for both services
          if ! exists "$MATRIX_JSON" "biz-ud-gothic" "hydra"; then echo "Error: biz-ud-gothic hydra should be included"; exit 1; fi
          if ! exists "$MATRIX_JSON" "biz-ud-gothic" "nixpkgs-update"; then echo "Error: biz-ud-gothic update should be included"; exit 1; fi

          echo "Assertion passed: Matrix filtered correctly by (package, service) pairs."

  # Job 2: Run the actual workflow to ensure it doesn't crash
  workflow-integration:
    needs: [verify-plan]
    uses: ./.github/workflows/health-check-by-list.yml
    with:
      pnames: '["hello", "biz-ud-gothic"]'
      config: 'nixpkgs-health-check-by-maintainer.toml'
