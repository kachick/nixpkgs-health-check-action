name: 🧪

on:
  pull_request:
    paths:
      - '.github/workflows/health-check*'
      - '.github/actions/**'
      - 'check-skip.*'
      - 'nixpkgs-health-check-by-maintainer.toml'

permissions:
  contents: read

jobs:
  # Job 1: Verify the Decision Maker logic (Skip-list filtering)
  verify-plan:
    name: 🧪 verify skip logic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@4e002c8ec80594ecd40e759629461e26c8abed15 # v31.9.0
        with:
          nix_path: 'nixpkgs=channel:nixpkgs-unstable'
      - name: Run plan action directly
        id: plan
        uses: ./.github/actions/plan
        with:
          pnames: '["hello", "biz-ud-gothic"]'
          config: 'nixpkgs-health-check-by-maintainer.toml'
      - name: Assertions
        env:
          MATRIX_JSON: ${{ steps.plan.outputs.matrix }}
        run: |
          echo "Generated Matrix: $MATRIX_JSON"

          # 1. Assert 'hello' is REMOVED from the list (because all services are skipped)
          if echo "$MATRIX_JSON" | jq -e '. | contains(["hello"])' > /dev/null; then echo "Error: hello should be fully filtered out"; exit 1; fi

          # 2. Assert 'biz-ud-gothic' is INCLUDED
          if ! echo "$MATRIX_JSON" | jq -e '. | contains(["biz-ud-gothic"])' > /dev/null; then echo "Error: biz-ud-gothic should be included"; exit 1; fi

          echo "Assertion passed: Matrix filtered correctly by package."

  # Job 2: Run the actual workflow to ensure it doesn't crash
  workflow-integration:
    needs: [verify-plan]
    uses: ./.github/workflows/health-check.yml
    with:
      pnames: '["hello", "biz-ud-gothic"]'
      config: 'nixpkgs-health-check-by-maintainer.toml'
