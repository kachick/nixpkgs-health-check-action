name: CI Runner Integration Test

on:
  pull_request:
    paths:
      - '.github/workflows/health-check.yml'
      - '.github/workflows/ci-runner.yml'
      - '.github/actions/**'
      - 'check-skip.*'
      - 'nixpkgs-health-check-by-maintainer.toml'

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      hello_run_hydra: ${{ steps.decide.outputs.hello_run_hydra }}
      hello_run_update: ${{ steps.decide.outputs.hello_run_update }}
      biz_run_hydra: ${{ steps.decide.outputs.biz_run_hydra }}
      biz_run_update: ${{ steps.decide.outputs.biz_run_update }}
    steps:
      - uses: cachix/install-nix-action@4e002c8ec80594ecd40e759629461e26c8abed15 # v31.9.0
        with:
          extra_nix_config: |
            sandbox = true
            accept-flake-config = true
      - name: Checkout health-check scripts
        uses: actions/checkout@v6
        with:
          repository: kachick/nixpkgs-health-check-action
          path: .health-check-action
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Checkout caller repo for config
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - id: decide
        run: |
          CONFIG="nixpkgs-health-check-by-maintainer.toml"

          check() {
            local pname=$1
            local service=$2
            ./.health-check-action/check-skip.bash --pname "$pname" --service "$service" --config "$CONFIG" | jq -r .skip
          }

          # Hello (Expected: skipped)
          [[ $(check "hello" "hydra") != "true" ]] && echo "hello_run_hydra=true" >> "$GITHUB_OUTPUT" || echo "hello_run_hydra=false" >> "$GITHUB_OUTPUT"
          [[ $(check "hello" "nixpkgs-update") != "true" ]] && echo "hello_run_update=true" >> "$GITHUB_OUTPUT" || echo "hello_run_update=false" >> "$GITHUB_OUTPUT"

          # Biz (Expected: run)
          [[ $(check "biz-ud-gothic" "hydra") != "true" ]] && echo "biz_run_hydra=true" >> "$GITHUB_OUTPUT" || echo "biz_run_hydra=false" >> "$GITHUB_OUTPUT"
          [[ $(check "biz-ud-gothic" "nixpkgs-update") != "true" ]] && echo "biz_run_update=true" >> "$GITHUB_OUTPUT" || echo "biz_run_update=false" >> "$GITHUB_OUTPUT"

  test-hello:
    needs: [plan]
    uses: ./.github/workflows/health-check.yml
    with:
      pname: 'hello'
      hydra: ${{ needs.plan.outputs.hello_run_hydra == 'true' }}
      nixpkgs-update: ${{ needs.plan.outputs.hello_run_update == 'true' }}

  verify-hello:
    needs: [test-hello]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Assert hello was skipped
        env:
          HYDRA_SKIPPED: ${{ needs.test-hello.outputs.hydra_skipped }}
          UPDATE_SKIPPED: ${{ needs.test-hello.outputs.nixpkgs_update_skipped }}
        run: |
          echo "Hydra skipped: $HYDRA_SKIPPED"
          [[ "$HYDRA_SKIPPED" == "true" ]] || (echo "Error: hello hydra should be skipped"; exit 1)
          [[ "$UPDATE_SKIPPED" == "true" ]] || (echo "Error: hello update should be skipped"; exit 1)

  test-biz:
    needs: [plan]
    uses: ./.github/workflows/health-check.yml
    with:
      pname: 'biz-ud-gothic'
      hydra: ${{ needs.plan.outputs.biz_run_hydra == 'true' }}
      nixpkgs-update: ${{ needs.plan.outputs.biz_run_update == 'true' }}

  verify-biz:
    needs: [test-biz]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Assert biz was NOT skipped
        env:
          HYDRA_SKIPPED: ${{ needs.test-biz.outputs.hydra_skipped }}
          UPDATE_SKIPPED: ${{ needs.test-biz.outputs.nixpkgs_update_skipped }}
        run: |
          echo "Hydra skipped: $HYDRA_SKIPPED"
          [[ "$HYDRA_SKIPPED" == "false" ]] || (echo "Error: biz hydra should NOT be skipped"; exit 1)
          [[ "$UPDATE_SKIPPED" == "false" ]] || (echo "Error: biz update should NOT be skipped"; exit 1)
