name: 🐶

on:
  schedule:
    # Every 10:42 JST
    - cron: '42 1 * * *'
  pull_request:
    types: [labeled]
  workflow_dispatch:

concurrency:
  group: dogfood-health-check
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      issues: write # Upsert the maintained packages dashboard issue
    uses: $/.github/workflows/health-check-by-maintainer.yml
    with:
      maintainer: 'kachick'
      config: 'nixpkgs-health-check-by-maintainer.toml'
      dashboard-id: 'maintainer'
      dashboard-title: 'Nixpkgs Health Check Dashboard (Maintained)'
      assignee: 'kachick'

  check-pr:
    name: Check maintained packages (PR dry-run)
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'run-maintainer-check')
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6 # v1.0.0
        with:
          extra-conf: |
            access-tokens = github.com=${{ github.token }}
            extra-substituters = https://kachick.cachix.org
            extra-trusted-public-keys = kachick.cachix.org-1:7giZGKW03gPFkbde09JNpDKCbDGGwBuU/Z11W/jUtEQ=
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch maintained packages
        id: fetch
        env:
          NIX_PATH: nixpkgs=channel:nixpkgs-unstable
        run: |
          {
            echo 'json<<JSON'
            nix run github:kachick/nixpkgs-maintained-by -- -id kachick -json
            echo 'JSON'
          } | tee --append "$GITHUB_OUTPUT"
      - name: Run health checks (dry-run)
        env:
          NIX_PATH: nixpkgs=channel:nixpkgs-unstable
        uses: $/
        with:
          pnames: ${{ steps.fetch.outputs.json }}
          config: 'nixpkgs-health-check-by-maintainer.toml'
