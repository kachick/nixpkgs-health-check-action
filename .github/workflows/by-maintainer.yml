name: by-maintainer # Keep short for the GitHub Web UI

on:
  schedule:
    # Every 10:42 JST
    # https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows#schedule
    - cron: '42 1 * * *'
  workflow_dispatch:
    inputs:
      maintainer:
        description: 'Maintainer ID of the package'
        required: true
        type: string
        default: 'kachick' # This should be a "key" of https://github.com/NixOS/nixpkgs/blob/master/maintainers/maintainer-list.nix
      config:
        description: 'Path to the configuration file for skipping checks'
        required: true
        type: string
        default: 'nixpkgs-health-check.toml'
  workflow_call:
    inputs:
      maintainer:
        description: 'Maintainer ID of the package'
        required: true
        type: string
      config:
        description: 'Path to the configuration file for skipping checks'
        required: true
        type: string
        default: 'nixpkgs-health-check.toml'
  pull_request:
    types: [labeled]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  get-pnames:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'run-maintainer-check')
    runs-on: ubuntu-24.04
    env:
      MAINTAINER: ${{ inputs.maintainer || 'kachick' }}
    outputs:
      json: '${{ steps.print-pnames-as-json.outputs.json }}'
    steps:
      - uses: cachix/install-nix-action@4e002c8ec80594ecd40e759629461e26c8abed15 # v31.9.0
        with:
          nix_path: 'nixpkgs=channel:nixpkgs-unstable'
          # Enable accept-flake-config for using the binary cache
          extra_nix_config: |
            sandbox = true
            accept-flake-config = true
      - id: print-pnames-as-json
        run: |
          {
            echo 'json<<JSON'
            nix run github:kachick/nixpkgs-maintained-by -- -id "$MAINTAINER" -json
            echo 'JSON'
          } | tee --append "$GITHUB_OUTPUT"

  check:
    needs: [get-pnames]
    strategy:
      fail-fast: false
      matrix:
        pname: '${{ fromJson(needs.get-pnames.outputs.json) }}'
    uses: ./.github/workflows/health-check.yml
    with:
      pname: '${{ matrix.pname }}'
      config: ${{ inputs.config || 'nixpkgs-health-check.toml' }}
