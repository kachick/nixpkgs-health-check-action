name: health-check-by-maintainer

on:
  workflow_dispatch:
    inputs:
      maintainer:
        description: 'Maintainer ID of the package'
        required: true
        type: string
        default: 'kachick'
      config:
        description: 'Path to the configuration file for skipping checks'
        required: true
        type: string
        default: 'nixpkgs-health-check-by-maintainer.toml'
  workflow_call:
    inputs:
      maintainer:
        description: 'Maintainer ID of the package'
        required: true
        type: string
        default: 'kachick'
      config:
        description: 'Path to the configuration file for skipping checks'
        required: true
        type: string
        default: 'nixpkgs-health-check-by-maintainer.toml'

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  plan:
    runs-on: ubuntu-24.04
    env:
      MAINTAINER: ${{ inputs.maintainer }}
      CONFIG: ${{ inputs.config }}
    outputs:
      matrix: '${{ steps.generate-matrix.outputs.matrix }}'
    steps:
      - uses: cachix/install-nix-action@4e002c8ec80594ecd40e759629461e26c8abed15 # v31.9.0
        with:
          nix_path: 'nixpkgs=channel:nixpkgs-unstable'
          extra_nix_config: |
            sandbox = true
            accept-flake-config = true
      - name: Checkout caller repo
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Checkout assets for skip-check
        uses: actions/checkout@v6
        with:
          repository: kachick/nixpkgs-health-check-action
          path: .health-check-action
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - id: generate-matrix
        run: |
          pnames=$(nix run github:kachick/nixpkgs-maintained-by -- -id "$MAINTAINER" -json)
          services='["hydra", "nixpkgs-update"]'

          # Generate a flattened matrix: each element is {pname, service, run}
          echo "$pnames" | jq -c --argjson services "$services" --arg config "$CONFIG" '
            . as $pnames 
            | [ $pnames[] | . as $pname | $services[] | {pname: $pname, service: .} ]
          ' > jobs.json

          # Annotate each job with skip status
          echo '[]' > annotated.json
          for job in $(cat jobs.json | jq -c '.[]'); do
            pname=$(echo "$job" | jq -r .pname)
            service=$(echo "$job" | jq -r .service)

            if [[ -f "$CONFIG" ]]; then
              skip=$(./.health-check-action/check-skip.bash --pname "$pname" --service "$service" --config "$CONFIG" | jq -r .skip)
            else
              skip="false"
            fi

            tmp=$(mktemp)
            echo "$job" | jq --arg run "$([[ "$skip" != "true" ]] && echo true || echo false)" \
              '. + {run: ($run == "true")}' > "$tmp"

            jq -c --slurp '.[0] + [.[1]]' annotated.json "$tmp" > annotated.tmp.json && mv annotated.tmp.json annotated.json
          done

          echo "matrix=$(cat annotated.json | jq -c .)" >> "$GITHUB_OUTPUT"

  check:
    needs: [plan]
    name: ${{ matrix.item.pname }} (${{ matrix.item.service }})
    if: matrix.item.run
    strategy:
      fail-fast: false
      matrix:
        item: '${{ fromJson(needs.plan.outputs.matrix) }}'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: cachix/install-nix-action@4e002c8ec80594ecd40e759629461e26c8abed15 # v31.9.0
        with:
          extra_nix_config: |
            sandbox = true
            accept-flake-config = true
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Run check
        uses: kachick/nixpkgs-health-check-action/.github/actions/${{ matrix.item.service }}@main
        with:
          pname: ${{ matrix.item.pname }}
