name: health-check-by-maintainer

on:
  workflow_dispatch:
    inputs:
      maintainer:
        description: 'Maintainer ID of the package'
        required: true
        type: string
      config:
        description: 'Path to the configuration file for skipping checks'
        required: true
        type: string
        default: 'nixpkgs-health-check-by-maintainer.toml'
  workflow_call:
    inputs:
      maintainer:
        description: 'Maintainer ID of the package'
        required: true
        type: string
      config:
        description: 'Path to the configuration file for skipping checks'
        required: true
        type: string
        default: 'nixpkgs-health-check-by-maintainer.toml'

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  get-pnames:
    runs-on: ubuntu-24.04
    outputs:
      pnames: '${{ steps.fetch.outputs.json }}'
    steps:
      - uses: cachix/install-nix-action@616559265b40713947b9c190a8ff4b507b5df49b # v31.10.4
        with:
          extra_nix_config: |
            sandbox = true
            accept-flake-config = true
      - id: fetch
        env:
          MAINTAINER_ID: ${{ inputs.maintainer }}
          NIX_PATH: nixpkgs=channel:nixpkgs-unstable
        run: |
          {
            echo 'json<<JSON'
            nix run github:kachick/nixpkgs-maintained-by -- -id "$MAINTAINER_ID" -json
            echo 'JSON'
          } | tee --append "$GITHUB_OUTPUT"

  runner:
    needs: [get-pnames]
    uses: ./.github/workflows/health-check.yml
    with:
      pnames: ${{ needs.get-pnames.outputs.pnames }}
      config: ${{ inputs.config }}
