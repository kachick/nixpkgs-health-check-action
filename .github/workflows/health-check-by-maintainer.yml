name: health-check-by-maintainer

on:
  workflow_dispatch:
    inputs:
      maintainer:
        description: 'Maintainer ID of the package'
        required: true
        type: string
        default: 'kachick'
      config:
        description: 'Path to the configuration file for skipping checks'
        required: true
        type: string
        default: 'nixpkgs-health-check.toml'
  workflow_call:
    inputs:
      maintainer:
        description: 'Maintainer ID of the package'
        required: true
        type: string
        default: 'kachick'
      config:
        description: 'Path to the configuration file for skipping checks'
        required: true
        type: string
        default: 'nixpkgs-health-check.toml'

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  plan:
    runs-on: ubuntu-24.04
    env:
      MAINTAINER: ${{ inputs.maintainer }}
      CONFIG: ${{ inputs.config }}
    outputs:
      matrix: '${{ steps.generate-matrix.outputs.matrix }}'
    steps:
      - uses: cachix/install-nix-action@4e002c8ec80594ecd40e759629461e26c8abed15 # v31.9.0
        with:
          nix_path: 'nixpkgs=channel:nixpkgs-unstable'
          extra_nix_config: |
            sandbox = true
            accept-flake-config = true
      - name: Checkout caller repo
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - id: generate-matrix
        run: |
          pnames=$(nix run github:kachick/nixpkgs-maintained-by -- -id "$MAINTAINER" -json)

          # Initialize JSON array
          echo '[]' > matrix.json

          for pname in $(echo "$pnames" | jq -r '.[]'); do
            # Use Nix Flake app for skip-check without checking out assets
            if [[ -f "$CONFIG" ]]; then
              hydra_skip=$(nix run github:kachick/nixpkgs-health-check-action#check-skip -- --pname "$pname" --service "hydra" --config "$CONFIG" | jq -r .skip)
              update_skip=$(nix run github:kachick/nixpkgs-health-check-action#check-skip -- --pname "$pname" --service "nixpkgs-update" --config "$CONFIG" | jq -r .skip)
            else
              hydra_skip="false"
              update_skip="false"
            fi

            # Append to matrix JSON
            tmp=$(mktemp)
            jq --arg pname "$pname" \
               --arg run_hydra "$([[ "$hydra_skip" != "true" ]] && echo true || echo false)" \
               --arg run_update "$([[ "$update_skip" != "true" ]] && echo true || echo false)" \
               '. += [{pname: $pname, run_hydra: ($run_hydra == "true"), run_update: ($run_update == "true")}]' \
               matrix.json > "$tmp" && mv "$tmp" matrix.json
          done

          echo "matrix=$(cat matrix.json | jq -c .)" >> "$GITHUB_OUTPUT"

  check:
    needs: [plan]
    strategy:
      fail-fast: false
      matrix:
        item: '${{ fromJson(needs.plan.outputs.matrix) }}'
    uses: ./.github/workflows/health-check.yml
    with:
      pname: '${{ matrix.item.pname }}'
      hydra: ${{ matrix.item.run_hydra }}
      nixpkgs-update: ${{ matrix.item.run_update }}
