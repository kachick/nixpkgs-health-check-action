name: health-check-by-maintainer

on:
  workflow_dispatch:
    inputs:
      maintainer:
        description: 'Maintainer ID of the package'
        required: true
        type: string
        default: 'kachick'
      config:
        description: 'Path to the configuration file for skipping checks'
        required: true
        type: string
        default: 'nixpkgs-health-check-by-maintainer.toml'
  workflow_call:
    inputs:
      maintainer:
        description: 'Maintainer ID of the package'
        required: true
        type: string
        default: 'kachick'
      config:
        description: 'Path to the configuration file for skipping checks'
        required: true
        type: string
        default: 'nixpkgs-health-check-by-maintainer.toml'

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  plan:
    runs-on: ubuntu-24.04
    env:
      MAINTAINER: ${{ inputs.maintainer }}
      CONFIG: ${{ inputs.config }}
    outputs:
      hydra_matrix: '${{ steps.generate-matrix.outputs.hydra_matrix }}'
      update_matrix: '${{ steps.generate-matrix.outputs.update_matrix }}'
    steps:
      - uses: cachix/install-nix-action@4e002c8ec80594ecd40e759629461e26c8abed15 # v31.9.0
        with:
          nix_path: 'nixpkgs=channel:nixpkgs-unstable'
          extra_nix_config: |
            sandbox = true
            accept-flake-config = true
      - name: Checkout health-check scripts
        uses: actions/checkout@v6
        with:
          repository: kachick/nixpkgs-health-check-action
          path: .health-check-action
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Checkout caller repo for config
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - id: generate-matrix
        run: |
          pnames=$(nix run github:kachick/nixpkgs-maintained-by -- -id "$MAINTAINER" -json)

          echo '[]' > hydra.json
          echo '[]' > update.json

          for pname in $(echo "$pnames" | jq -r '.[]'); do
            if [[ -f "$CONFIG" ]]; then
              hydra_skip=$(./.health-check-action/check-skip.bash --pname "$pname" --service "hydra" --config "$CONFIG" | jq -r .skip)
              update_skip=$(./.health-check-action/check-skip.bash --pname "$pname" --service "nixpkgs-update" --config "$CONFIG" | jq -r .skip)
            else
              hydra_skip="false"
              update_skip="false"
            fi

            if [[ "$hydra_skip" != "true" ]]; then
              tmp=$(mktemp); jq -c --arg p "$pname" '. += [$p]' hydra.json > "$tmp" && mv "$tmp" hydra.json
            fi
            if [[ "$update_skip" != "true" ]]; then
              tmp=$(mktemp); jq -c --arg p "$pname" '. += [$p]' update.json > "$tmp" && mv "$tmp" update.json
            fi
          done

          echo "hydra_matrix=$(cat hydra.json | jq -c .)" >> "$GITHUB_OUTPUT"
          echo "update_matrix=$(cat update.json | jq -c .)" >> "$GITHUB_OUTPUT"

  hydra:
    needs: [plan]
    name: hydra / ${{ matrix.pname }}
    strategy:
      fail-fast: false
      matrix:
        pname: '${{ fromJson(needs.plan.outputs.hydra_matrix) }}'
    runs-on: ubuntu-24.04
    steps:
      - uses: cachix/install-nix-action@4e002c8ec80594ecd40e759629461e26c8abed15 # v31.9.0
        with:
          extra_nix_config: |
            sandbox = true
            accept-flake-config = true
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Run hydra check
        uses: ./.github/actions/hydra
        with:
          pname: ${{ matrix.pname }}

  nixpkgs-update:
    needs: [plan]
    name: nixpkgs-update / ${{ matrix.pname }}
    strategy:
      fail-fast: false
      matrix:
        pname: '${{ fromJson(needs.plan.outputs.update_matrix) }}'
    runs-on: ubuntu-24.04
    steps:
      - uses: cachix/install-nix-action@4e002c8ec80594ecd40e759629461e26c8abed15 # v31.9.0
        with:
          extra_nix_config: |
            sandbox = true
            accept-flake-config = true
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Run update check
        uses: ./.github/actions/nixpkgs-update
        with:
          pname: ${{ matrix.pname }}
