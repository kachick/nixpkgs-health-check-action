name: health-check-by-maintainer

on:
  workflow_dispatch:
    inputs:
      maintainer:
        description: 'Maintainer ID of the package'
        required: true
        type: string
      config:
        description: 'Path to the configuration file for skipping or ignoring checks'
        required: true
        type: string
        default: 'nixpkgs-health-check-by-maintainer.toml'
      dashboard-id:
        description: 'Dashboard identifier; when non-empty, upserts a GitHub Dashboard Issue'
        required: false
        type: string
        default: ''
      dashboard-title:
        description: 'Title for the Dashboard Issue'
        required: false
        type: string
        default: ''
      assignee:
        description: 'GitHub username to assign when errors are present (defaults to maintainer)'
        required: false
        type: string
        default: ''
  workflow_call:
    inputs:
      maintainer:
        description: 'Maintainer ID of the package'
        required: true
        type: string
      config:
        description: 'Path to the configuration file for skipping or ignoring checks'
        required: true
        type: string
        default: 'nixpkgs-health-check-by-maintainer.toml'
      dashboard-id:
        description: 'Dashboard identifier; when non-empty, upserts a GitHub Dashboard Issue'
        required: false
        type: string
        default: ''
      dashboard-title:
        description: 'Title for the Dashboard Issue'
        required: false
        type: string
        default: ''
      assignee:
        description: 'GitHub username to assign when errors are present (defaults to maintainer)'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  get-pnames:
    name: Get package names
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      pnames: '${{ steps.fetch.outputs.json }}'
    steps:
      - uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6 # v1.0.0
        with:
          # access-tokens: Prevent GitHub API rate limiting during `nix run github:`
          extra-conf: |
            access-tokens = github.com=${{ github.token }}
            extra-substituters = https://kachick.cachix.org
            extra-trusted-public-keys = kachick.cachix.org-1:7giZGKW03gPFkbde09JNpDKCbDGGwBuU/Z11W/jUtEQ=
      - id: fetch
        env:
          MAINTAINER_ID: ${{ inputs.maintainer }}
          NIX_PATH: nixpkgs=channel:nixpkgs-unstable
        run: |
          {
            echo 'json<<JSON'
            nix run github:kachick/nixpkgs-maintained-by -- -id "$MAINTAINER_ID" -json
            echo 'JSON'
          } | tee --append "$GITHUB_OUTPUT"

  runner:
    needs: [get-pnames]
    permissions:
      contents: read
      issues: write # Upsert the health check dashboard issue when dashboard-id is set
    uses: $/.github/workflows/health-check.yml
    with:
      pnames: ${{ needs.get-pnames.outputs.pnames }}
      config: ${{ inputs.config }}
      dashboard-id: ${{ inputs.dashboard-id }}
      dashboard-title: ${{ inputs.dashboard-title }}
      assignee: ${{ inputs.assignee || inputs.maintainer }}
