# https://taskfile.dev/styleguide/
# Avoid chaining commands with ; or && in a single line. Use multiple cmd items for independent steps, or write a script under scripts/ instead.

version: '3'

tasks:
  default:
    deps:
      - task: fmt
      - task: lint
      - task: test
  check:
    deps:
      - task: test
      - task: lint
  test:
    cmds:
      - go test ./...
      - go vet ./...
  fmt:
    cmds:
      - go fmt ./...
      - dprint fmt
  lint:
    cmds:
      - dprint check
      - typos . .github .vscode
      - zizmor --pedantic .
      - gitleaks dir . --verbose
